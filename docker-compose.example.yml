# Example Docker Compose file for the weather forecast collector.
#
# Quick start:
#   git clone https://github.com/PribilofTraffic/Weather-Forecast.git
#   cd Weather-Forecast
#   cp docker-compose.example.yml docker-compose.yml
#   # edit the settings below, then:
#   docker compose up -d
#
# Forecast files appear in ./data within a few seconds.
# Forecasts come from the US National Weather Service, so this works for
# places in the United States and its territories.

services:
  weather-forecast:
    build: .
    container_name: weather-forecast
    restart: unless-stopped
    environment:
      # Your time zone. Times in the output follow it, including the switch
      # between standard and daylight time.
      # List: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=America/Anchorage

      # WHERE: use ZIP_CODES, LOCATIONS, or both.
      #
      # US zip codes, comma-separated. Each one is turned into coordinates
      # once (through api.zippopotam.us) and remembered in data/zip_cache.json.
      - ZIP_CODES=99501,99701

      # Places a zip code does not describe well, as "Name,latitude,longitude"
      # separated by semicolons. No lookup service is involved for these.
      # - LOCATIONS=Cabin,61.52,-149.63;Boat Harbor,60.12,-149.44

      # How often to fetch, in seconds. NWS refreshes its forecast about once
      # an hour, so a shorter interval only returns the same answer.
      - UPDATE_INTERVAL=3600

      # MARINE FORECAST (optional, off unless MARINE_ZONE is set).
      # Find your zone id and its text bulletin at
      # https://www.weather.gov/marine/ then set both:
      # - MARINE_ZONE=PKZ766
      # - MARINE_URL=https://tgftp.nws.noaa.gov/data/raw/fz/fzak52.pafc.cwf.alu.txt
      # - MARINE_ZONE_NAME=Pribilof Islands Nearshore Waters

      # NWS asks API users to identify themselves with an app name and a
      # contact, so they can reach you instead of blocking you.
      # - USER_AGENT=my-forecast-collector/1.0 (you@example.com)

      # ALERTS (optional): push a message to an ntfy server when a forecast
      # source stays down. See https://ntfy.sh
      # - NTFY_URL=https://ntfy.sh
      # - NTFY_TOPIC=my-forecast-alerts
      # - NTFY_TOKEN=
    volumes:
      # Forecast files are written here
      - ./data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
